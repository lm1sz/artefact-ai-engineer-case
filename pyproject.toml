[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio-agent"
version = "0.1.0"
description = "Grounded customer service agent for Emporio da Musica"
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<7", "tzdata>=2025.1"]

[project.scripts]
emporio = "chatbot.cli:principal"

[tool.setuptools.packages.find]
include = ["chatbot*", "ui"]
namespaces = false

[tool.setuptools.package-data]
chatbot = ["prompt.txt", "data/*.csv", "data/*.pdf"]

ui = ["*.html", "*.css", "*.js"]
